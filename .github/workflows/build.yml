name: Build Atria (slim)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ldid xz dpkg 2>/dev/null || true

      - name: Clone Theos
        run: |
          export THEOS=$GITHUB_WORKSPACE/theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "PATH=$THEOS/bin:$PATH" >> $GITHUB_ENV
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "--- theos cloned ---"

      - name: Download iPhoneOS SDK
        run: |
          export THEOS=$GITHUB_WORKSPACE/theos
          mkdir -p $THEOS/sdks
          cd /tmp
          curl -fsSL -A "Mozilla/5.0" \
            -o sdks.zip \
            https://codeload.github.com/theos/sdks/zip/refs/heads/master
          ls -la sdks.zip
          unzip -q -o sdks.zip
          ls -d sdks-master/*.sdk
          cp -R sdks-master/iPhoneOS16.5.sdk $THEOS/sdks/
          ls $THEOS/sdks

      - name: Apply slim patch
        run: |
          git apply -v .github/slim.patch || echo "[warn] slim.patch 未应用"

      - name: Fix for modern Theos / clang
        run: |
          python3 - <<'PYEOF'
          import re

          # ---------- 1. GridLayout.xm: double -> short 窄化 + 字段顺序 ----------
          p = 'src/Hooks/GridLayout.xm'
          s = open(p, encoding='utf-8').read()
          before = s

          s = s.replace('{ .height = 0x7FFF, .width = 0x7FFF }',
                        '{ .width = 0x7FFF, .height = 0x7FFF }')

          def is_int_literal(e):
              return re.fullmatch(r'\s*0[xX][0-9a-fA-F]+\s*|\s*\d+\s*', e) is not None

          def fix_naked(m):
              field, expr = m.group(1), m.group(2)
              if 'ROUND_SHORT' in expr or is_int_literal(expr):
                  return m.group(0)
              return '.%s = ROUND_SHORT(%s)' % (field, expr)

          s = re.sub(r'\.(width|height) = ([^,;}]+?)(?=\s*[,;}])', fix_naked, s)
          open(p, 'w', encoding='utf-8').write(s)
          print('GridLayout.xm patched:', before != s)

          # ---------- 2. IconView.xm: %orig 不能嵌在消息表达式内 ----------
          p = 'src/Hooks/IconView.xm'
          s = open(p, encoding='utf-8').read()
          before = s
          old = '\tNSMutableArray *items = [%orig mutableCopy];'
          new = '\tNSArray *_atriaOrigItems = %orig;\n\tNSMutableArray *items = [_atriaOrigItems mutableCopy];'
          if old in s:
              s = s.replace(old, new)
              open(p, 'w', encoding='utf-8').write(s)
          print('IconView.xm patched:', before != s)

          # ---------- 3. DockView.xm: %orig 参数内嵌消息改为局部变量 ----------
          p = 'src/Hooks/DockView.xm'
          s = open(p, encoding='utf-8').read()
          before = s
          old2 = '    %orig([[ARITweakManager sharedInstance] floatValueForKey:@"dock_bg"]);'
          new2 = '    CGFloat _atriaBgAlpha = [[ARITweakManager sharedInstance] floatValueForKey:@"dock_bg"];\n    %orig(_atriaBgAlpha);'
          if old2 in s:
              s = s.replace(old2, new2)
              open(p, 'w', encoding='utf-8').write(s)
          print('DockView.xm patched:', before != s)
          PYEOF

          echo "--- 校验 ---"
          grep -n "ROUND_SHORT(cols)" src/Hooks/GridLayout.xm | head -3
          grep -n "_atriaOrigItems" src/Hooks/IconView.xm
          grep -n "_atriaBgAlpha" src/Hooks/DockView.xm

      - name: Build (rootless)
        run: |
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: Atria-slim-deb
          path: packages/*.deb
