name: Build Atria (slim)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ldid xz dpkg 2>/dev/null || true

      - name: Clone Theos
        run: |
          export THEOS=$GITHUB_WORKSPACE/theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "PATH=$THEOS/bin:$PATH" >> $GITHUB_ENV
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "--- theos cloned ---"

      - name: Download iPhoneOS SDK
        run: |
          export THEOS=$GITHUB_WORKSPACE/theos
          mkdir -p $THEOS/sdks
          cd /tmp
          curl -fsSL -A "Mozilla/5.0" \
            -o sdks.zip \
            https://codeload.github.com/theos/sdks/zip/refs/heads/master
          ls -la sdks.zip
          unzip -q -o sdks.zip
          cp -R sdks-master/iPhoneOS16.5.sdk $THEOS/sdks/
          echo "--- sdks ---"
          ls $THEOS/sdks
          echo "--- PrivateFrameworks ---"
          ls $THEOS/sdks/iPhoneOS16.5.sdk/System/Library/PrivateFrameworks 2>/dev/null | head -20 || echo "(无 PrivateFrameworks 目录)"

      - name: Apply slim patch
        run: |
          echo "=== 应用前确认功能键仍在 ==="
          grep -c "enableAppLibrary" src/Hooks/AppLibrary.xm || echo "(已无)"
          git apply -v .github/slim.patch
          echo "=== 应用后校验（应全部为 0）==="
          for k in enableAppLibrary disableDock forceFloatingDock hideLabels hideBadges disableTapGesture showWelcome showBackground dropShadow showPageLabels labelTextColor; do
            n=$(grep -rn "$k" --include=*.xm --include=*.m --include=*.h --include=*.plist src Prefs 2>/dev/null | wc -l)
            echo "  $k = $n"
          done
          test ! -f Prefs/Resources/PageLabels.plist && echo "  PageLabels.plist 已删除 OK"
          test ! -f Prefs/Resources/Customization.plist && echo "  Customization.plist 已删除 OK"

      - name: Auto-fix all known build issues
        run: |
          python3 - <<'PYEOF'
          import re, os

          def edit(path, fn):
              if not os.path.exists(path):
                  print('skip (missing):', path); return
              s = open(path, encoding='utf-8').read()
              before = s
              s = fn(s)
              if s != before:
                  open(path, 'w', encoding='utf-8').write(s)
                  print('patched:', path)
              else:
                  print('unchanged:', path)

          # ---------- 1. GridLayout.xm: double->short 窄化 + 字段顺序 ----------
          def fix_grid(s):
              s = s.replace('{ .height = 0x7FFF, .width = 0x7FFF }',
                            '{ .width = 0x7FFF, .height = 0x7FFF }')
              def is_int(e):
                  return re.fullmatch(r'\s*0[xX][0-9a-fA-F]+\s*|\s*\d+\s*', e) is not None
              def fx(m):
                  f, e = m.group(1), m.group(2)
                  return m.group(0) if ('ROUND_SHORT' in e or is_int(e)) else '.%s = ROUND_SHORT(%s)' % (f, e)
              return re.sub(r'\.(width|height) = ([^,;}]+?)(?=\s*[,;}])', fx, s)
          edit('src/Hooks/GridLayout.xm', fix_grid)

          # ---------- 2. IconView.xm: %orig 不能嵌在消息表达式里 ----------
          def fix_icon(s):
              return s.replace('\tNSMutableArray *items = [%orig mutableCopy];',
                  '\tNSArray *_atriaOrigItems = %orig;\n\tNSMutableArray *items = [_atriaOrigItems mutableCopy];')
          edit('src/Hooks/IconView.xm', fix_icon)

          # ---------- 3. DockView.xm: %orig 参数内嵌消息 ----------
          def fix_dock(s):
              return s.replace('    %orig([[ARITweakManager sharedInstance] floatValueForKey:@"dock_bg"]);',
                  '    CGFloat _atriaBgAlpha = [[ARITweakManager sharedInstance] floatValueForKey:@"dock_bg"];\n    %orig(_atriaBgAlpha);')
          edit('src/Hooks/DockView.xm', fix_dock)

          # ---------- 4. MainLayout.xm: 删除因删功能而未使用的变量 ----------
          def fix_main(s):
              s = s.replace('\t\tBOOL isInRootViews = [[manager allRootListViews] containsObject:self];\n', '')
              s = s.replace('\t\t// Checks if the icon list is actually in the root views\n', '')
              return s
          edit('src/Hooks/MainLayout.xm', fix_main)

          # ---------- 5. 根 Makefile: 去掉 tweak 不需要的框架 ----------
          def fix_mk(s):
              # 主 tweak 不链接 Preferences（只有 Prefs bundle 需要）
              s = re.sub(r'^[A-Za-z_]*(PRIVATE_FRAMEWORKS)\s*=.*$', '', s, flags=re.M)
              # CoreText 未被使用（适配 Atria_ 与 AtriaPrefs_ 两种前缀）
              s = re.sub(r'^([A-Za-z_]*FRAMEWORKS\s*=\s*UIKit)\s+CoreText\s*$', r'\1', s, flags=re.M)
              if 'GO_EASY_ON_ME' not in s:
                  s = s.replace('include $(THEOS)/makefiles/common.mk',
                                'include $(THEOS)/makefiles/common.mk\n\nGO_EASY_ON_ME = 1')
              return s
          edit('Makefile', fix_mk)

          # ---------- 5b. ARIHeaderCell.m: PACKAGE_VERSION / PACKAGE_TYPE 未定义 ----------
          def fix_header_cell(s):
              target = '@"Version " PACKAGE_VERSION " (" PACKAGE_TYPE ")"'
              if target in s:
                  return s.replace(target, '@"Version 1.4.1 (rootless)"')
              return s
          edit('Prefs/src/ARIHeaderCell.m', fix_header_cell)

          # ---------- 6. Prefs Makefile: 修签名标志 + 允许动态查找符号 ----------
          def fix_prefs_mk(s):
              # 原来误把 control 文件当作 entitlements，会导致签名失败
              s = re.sub(r'^[A-Za-z_]*CODESIGN_FLAGS\s*=.*$', '', s, flags=re.M)
              # CoreText 未被使用
              s = re.sub(r'^([A-Za-z_]*FRAMEWORKS\s*=\s*UIKit)\s+CoreText\s*$', r'\1', s, flags=re.M)
              # Preferences.framework 二进制不在 SDK 里，链接会失败，去掉
              s = re.sub(r'^[A-Za-z_]*PRIVATE_FRAMEWORKS\s*=.*Preferences.*$', '', s, flags=re.M)
              # 用运行时查找代替链接该框架
              if 'dynamic_lookup' not in s:
                  s = s.replace('include $(THEOS_MAKE_PATH)/bundle.mk',
                                'AtriaPrefs_LDFLAGS = -undefined dynamic_lookup\n\ninclude $(THEOS_MAKE_PATH)/bundle.mk')
              if 'GO_EASY_ON_ME' not in s:
                  s = s.replace('include $(THEOS)/makefiles/common.mk',
                                'include $(THEOS)/makefiles/common.mk\n\nGO_EASY_ON_ME = 1')
              return s
          edit('Prefs/Makefile', fix_prefs_mk)
          PYEOF

          echo "=== 修复后 Makefile ==="
          cat Makefile
          echo "=== 修复后 Prefs/Makefile ==="
          cat Prefs/Makefile

      - name: Build (rootless)
        run: |
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless GO_EASY_ON_ME=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: Atria-slim-deb
          path: packages/*.deb
