name: Build Atria (slim)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ldid xz dpkg 2>/dev/null || true

      - name: Clone Theos
        run: |
          export THEOS=$GITHUB_WORKSPACE/theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "PATH=$THEOS/bin:$PATH" >> $GITHUB_ENV
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "--- theos cloned ---"

      - name: Download iPhoneOS SDK
        run: |
          export THEOS=$GITHUB_WORKSPACE/theos
          mkdir -p $THEOS/sdks
          cd /tmp
          curl -fsSL -A "Mozilla/5.0" \
            -o sdks.zip \
            https://codeload.github.com/theos/sdks/zip/refs/heads/master
          ls -la sdks.zip
          unzip -q -o sdks.zip
          ls -d sdks-master/*.sdk
          cp -R sdks-master/iPhoneOS16.5.sdk $THEOS/sdks/
          ls $THEOS/sdks

      - name: Apply slim patch
        run: git apply -v .github/slim.patch

      - name: Apply build fix patch
        run: git apply -v .github/fix-build.patch || echo "fix-build.patch not found or already applied"

      - name: Build (rootless)
        run: |
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: Atria-slim-deb
          path: packages/*.deb
